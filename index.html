<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn Dashboard</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="stylesheet" href="./assets/css/dashboard.css">
</head>
    <body class="page-dashboard">
        <div class="container">

            <aside class="sidebar">

                <h2>Torn Tools</h2>

                <a href="./index.html">Dashboard</a>
                <a href="./pages/market.html">Market</a>
                <a href="./pages/company.html">Company</a>
                <a href="./pages/faction-scout.html">Faction Scouter</a>
                <a href="./pages/travel.html">Travel</a>
                <a href="./pages/bank.html">Bank</a>
                <a href="./pages/gym.html">Gym</a>
                <a href="./pages/crimes.html">Crimes</a>
                <a href="./pages/settings.html">Settings</a>

            </aside>

            <main class="content">

                <div class="header">
                    <h1>Dashboard</h1>
                    <span>
                        <span id="user-name">McGubbins</span>
                        <span> | </span>
                        <span id="user-faction">No Faction</span>
                    </span>
                </div>

                <div class="cards">

                    <div class="card">
                        <h3>Networth</h3>
                        <div class="value" id="user-networth">$0
                        </div>
                    </div>

                    <div class="card">
                        <h3>Level</h3>
                        <div class="value" id="user-level">35</div>
                    </div>

                    <div class="card">
                        <h3>Energy</h3>
                        <div class="value" id="user-energy">150 / 150</div>
                    </div>

                    <div class="card">
                        <h3>Nerve</h3>
                        <div class="value" id="user-nerve">60 / 60</div>
                    </div>

                    <div class="card">
                        <h3>Happy</h3>
                        <div class="value" id="user-happy">4,950 / 5,000</div>
                    </div>

                    <div class="card">
                        <h3>Life</h3>
                        <div class="value" id="user-life">0 / 0</div>
                    </div>

                </div>

            </main>

        </div>

        <script src="./assets/js/main.js"></script>
        <script src="./assets/js/dashboard.js"></script>
    </body>
</html>
