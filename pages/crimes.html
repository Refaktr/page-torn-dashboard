<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crimes | Torn Dashboard</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/crimes.css">
</head>
<body class="page-crimes">
    <div class="container">
        <aside class="sidebar">
            <h2>Torn Tools</h2>
            <a href="../index.html">Dashboard</a>
            <a href="./market.html">Market</a>
            <a href="./company.html">Company</a>
            <a href="./faction-scout.html">Faction Scouter</a>

        <main class="content">
            <div class="header">
                <h1>Crimes</h1>
                <span id="crimes-status">Ready</span>
            </div>
            <section class="page-placeholder">
                <p>Crime IDs 1 to 9 are loaded one-by-one and summarized below.</p>
            </section>

            <section class="card crimes-controls">
                <div class="crimes-controls-row">
                    <strong>Crime Range:</strong>
                    <span id="crime-range-text">1-9</span>
                </div>
                <div class="crimes-controls-row">
                    <strong>Loaded:</strong>
                    <span id="crimes-loaded-count">0 / 9</span>
                </div>
            </section>

            <section class="cards crimes-summary" id="crimes-summary"></section>
            <section class="crimes-list" id="crimes-list"></section>
        </main>
    </div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/crimes.js"></script>
